<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文化小吃部 - 線上點餐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .info {
            font-size: 0.9em;
            opacity: 0.95;
        }

        .hero-banner {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }

        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            padding: 30px;
        }

        .menu-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
        }

        .menu-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .menu-item {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .menu-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        .menu-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .menu-item h3 {
            color: #f5576c;
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .menu-item .price {
            color: #667eea;
            font-size: 1.5em;
            font-weight: bold;
            margin: 10px 0;
        }

        .menu-item button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .menu-item button:hover {
            opacity: 0.9;
        }

        .cart-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            position: sticky;
            top: 20px;
            height: fit-content;
        }

        .cart-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .cart-items {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .cart-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-info h4 {
            color: #333;
            margin-bottom: 5px;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-item-controls button {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 5px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-size: 1em;
        }

        .cart-item-controls span {
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }

        .cart-total {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .cart-total h3 {
            font-size: 1.5em;
        }

        .checkout-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .checkout-btn:hover {
            opacity: 0.9;
        }

        .checkout-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .empty-cart {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        .modal-content h2 {
            color: #11998e;
            margin-bottom: 20px;
        }

        .modal-content button {
            margin-top: 20px;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .cart-section {
                position: static;
            }

            .menu-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="hero.jpg" alt="文化小吃部橫幅" class="hero-banner">
        <header>
            <h1>🍜 文化小吃部</h1>
            <div class="info">
                <p>📍 地址：臺北市11114陽明山華岡路55號</p>
                <p>📞 電話：23334445</p>
            </div>
        </header>

        <div class="main-content">
            <div class="menu-section">
                <h2>📋 菜單</h2>
                <div class="menu-grid" id="menuGrid"></div>
            </div>

            <div class="cart-section">
                <h2>🛒 購物車</h2>
                <div class="cart-items" id="cartItems">
                    <div class="empty-cart">購物車是空的</div>
                </div>
                <div class="cart-total">
                    <h3>總計：NT$ <span id="totalPrice">0</span></h3>
                </div>
                <button class="checkout-btn" id="checkoutBtn" disabled>確認訂單</button>
            </div>
        </div>
    </div>

    <div class="modal" id="orderModal">
        <div class="modal-content">
            <h2>✅ 訂單已送出！</h2>
            <p>感謝您的訂購，我們會盡快為您準備餐點。</p>
            <p style="margin-top: 15px; color: #667eea; font-weight: bold;">訂單編號：<span id="orderNumber"></span></p>
            <button onclick="closeModal()">關閉</button>
        </div>
    </div>

    <script>
        const menuItems = [
            { id: 1, name: '吉士漢堡', price: 120, image: '吉士漢堡.jpg' },
            { id: 2, name: '麥香魚', price: 90, image: '麥香魚.jpg' },
            { id: 3, name: '麥香雞', price: 50, image: '麥香雞.jpg' },
            { id: 4, name: '麥脆雞', price: 60, image: '麥脆雞.jpg' },
            { id: 5, name: '義士烤雞沙拉', price: 60, image: '義士烤雞沙拉.jpg' },
            { id: 6, name: '嫩煎雞腿堡', price: 60, image: '嫩煎雞腿堡.jpg' }
        ];

        let cart = {};

        function renderMenu() {
            const menuGrid = document.getElementById('menuGrid');
            menuGrid.innerHTML = menuItems.map(item => `
                <div class="menu-item">
                    <img src="${item.image}" alt="${item.name}">
                    <h3>${item.name}</h3>
                    <div class="price">NT$ ${item.price}</div>
                    <button onclick="addToCart(${item.id})">加入購物車</button>
                </div>
            `).join('');
        }

        function addToCart(itemId) {
            const item = menuItems.find(i => i.id === itemId);
            if (cart[itemId]) {
                cart[itemId].quantity++;
            } else {
                cart[itemId] = { ...item, quantity: 1 };
            }
            updateCart();
        }

        function removeFromCart(itemId) {
            if (cart[itemId].quantity > 1) {
                cart[itemId].quantity--;
            } else {
                delete cart[itemId];
            }
            updateCart();
        }

        function updateCart() {
            const cartItems = document.getElementById('cartItems');
            const totalPrice = document.getElementById('totalPrice');
            const checkoutBtn = document.getElementById('checkoutBtn');

            const cartArray = Object.values(cart);
            
            if (cartArray.length === 0) {
                cartItems.innerHTML = '<div class="empty-cart">購物車是空的</div>';
                totalPrice.textContent = '0';
                checkoutBtn.disabled = true;
                return;
            }

            cartItems.innerHTML = cartArray.map(item => `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <h4>${item.name}</h4>
                        <div>NT$ ${item.price} × ${item.quantity}</div>
                    </div>
                    <div class="cart-item-controls">
                        <button onclick="removeFromCart(${item.id})">-</button>
                        <span>${item.quantity}</span>
                        <button onclick="addToCart(${item.id})">+</button>
                    </div>
                </div>
            `).join('');

            const total = cartArray.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            totalPrice.textContent = total;
            checkoutBtn.disabled = false;
        }

        function checkout() {
            const orderNumber = 'WH' + Date.now().toString().slice(-8);
            document.getElementById('orderNumber').textContent = orderNumber;
            document.getElementById('orderModal').classList.add('active');
            cart = {};
            updateCart();
        }

        function closeModal() {
            document.getElementById('orderModal').classList.remove('active');
        }

        document.getElementById('checkoutBtn').addEventListener('click', checkout);

        renderMenu();
    </script>
</body>
</html>
